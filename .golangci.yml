version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
  disable:
    - exhaustive
  exclusions:
    rules:
      # Test dosyalarında errcheck zorunlu değil
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
